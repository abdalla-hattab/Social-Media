<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار الفيديوهات</title>
    <meta name="description" content="شوف الفيديوهات واختار موافق أو مو موافق لكل فيديو">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://socail-media-creation-default-rtdb.firebaseio.com">
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
    <link rel="preconnect" href="https://securetoken.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --ink: #0f172a;
            --ink-2: #475569;
            --muted: #94a3b8;
            --line: #e2e8f0;
            --accent: #5b4bdb;
            --yes: #16a34a;
            --yes-soft: #dcfce7;
            --no: #dc2626;
            --no-soft: #fee2e2;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
        body { font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif; line-height: 1.6; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
        header p { margin: 0; color: var(--ink-2); font-size: 15px; }
        .voter {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            padding: 10px 14px; margin-bottom: 16px; font-size: 14px; color: var(--ink-2);
        }
        .voter b { color: var(--ink); }
        .link-btn { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 4px; }
        .video {
            background: var(--card); border: 1px solid var(--line); border-radius: 18px;
            padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
        }
        .video-top { display: flex; gap: 12px; align-items: center; }
        .thumb {
            width: 72px; height: 96px; border-radius: 12px; background: #e9ecf5 center/cover no-repeat;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--muted);
        }
        .video-info { flex: 1; min-width: 0; }
        .video-date { font-size: 13px; color: var(--muted); font-weight: 600; }
        .video-title { font-size: 15px; font-weight: 600; margin: 2px 0 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .watch {
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
            background: #0f172a; color: #fff; border-radius: 10px; padding: 7px 14px; font-size: 14px; font-weight: 600;
        }
        .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
        .vote-btn {
            border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
            border: 2px solid var(--line); background: #fff; color: var(--ink-2); transition: all .15s;
        }
        .vote-btn.yes:hover { border-color: var(--yes); color: var(--yes); }
        .vote-btn.no:hover { border-color: var(--no); color: var(--no); }
        .vote-btn.yes.on { background: var(--yes); border-color: var(--yes); color: #fff; }
        .vote-btn.no.on { background: var(--no); border-color: var(--no); color: #fff; }
        .vote-btn:disabled { opacity: .6; cursor: wait; }
        .my-vote { margin-top: 8px; font-size: 13px; color: var(--muted); text-align: center; min-height: 20px; }
        .note { margin-top: 10px; background: var(--no-soft); border-radius: 12px; padding: 10px; }
        .note label { display: block; font-size: 14px; font-weight: 600; color: #991b1b; margin-bottom: 6px; }
        .note textarea {
            width: 100%; padding: 10px; border: 1px solid #fecaca; border-radius: 10px; background: #fff;
            font: inherit; font-size: 15px; resize: vertical; min-height: 64px;
        }
        .note textarea:focus { outline: none; border-color: var(--no); }
        .note-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
        .note-saved { font-size: 13px; color: #991b1b; }
        .note-btn {
            border: none; border-radius: 10px; background: var(--no); color: #fff; font: inherit;
            font-size: 14px; font-weight: 700; padding: 8px 18px; cursor: pointer; flex-shrink: 0;
        }
        .note-btn:disabled { opacity: .6; cursor: wait; }
        .att-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .att-btn {
            display: inline-flex; align-items: center; gap: 4px; border: 1px solid #fecaca; background: #fff; color: #991b1b;
            border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .att-btn.on { background: var(--no); border-color: var(--no); color: #fff; }
        .att-help { margin-top: 10px; background: #fff; border: 1px solid #fecaca; border-radius: 10px; padding: 10px; }
        .att-help[hidden] { display: none; }
        .att-help-text { margin: 0 0 8px; font-size: 14px; line-height: 1.7; color: #7f1d1d; }
        .note label.att-btn { display: inline-flex; margin-bottom: 0; }
        .att-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .att-list:empty { display: none; }
        .att-item { position: relative; }
        .att-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; display: block; }
        .att-item audio { width: 230px; max-width: 70vw; height: 36px; display: block; }
        .att-del {
            position: absolute; top: -7px; left: -7px; width: 22px; height: 22px; border-radius: 50%; border: none;
            background: #0f172a; color: #fff; font-size: 12px; line-height: 22px; padding: 0; cursor: pointer;
        }
        .state { text-align: center; padding: 48px 16px; color: var(--ink-2); font-size: 16px; }
        .overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none;
            align-items: center; justify-content: center; padding: 16px; z-index: 10;
        }
        .overlay.show { display: flex; }
        .dialog { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 380px; }
        .dialog h2 { margin: 0 0 6px; font-size: 18px; }
        .dialog p { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
        .dialog input {
            width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
            font: inherit; font-size: 16px; margin-bottom: 12px;
        }
        .dialog input:focus { outline: none; border-color: var(--accent); }
        .primary {
            width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--accent);
            color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .player {
            position: fixed; inset: 0; background: rgba(15,23,42,.92); z-index: 30;
            display: none; flex-direction: column; padding: 12px;
        }
        .player.show { display: flex; }
        .player-bar { display: flex; align-items: center; gap: 10px; color: #fff; padding: 0 2px 10px; }
        .player-bar b { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .player-close {
            border: none; border-radius: 10px; background: #fff; color: var(--ink); font: inherit;
            font-size: 15px; font-weight: 700; padding: 8px 16px; cursor: pointer; flex-shrink: 0;
        }
        .player-open { color: #cbd5e1; font-size: 13px; flex-shrink: 0; }
        .player iframe { flex: 1; width: 100%; border: 0; border-radius: 12px; background: #000; }
        .player-wait { position: absolute; inset: 60px 12px 12px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 15px; pointer-events: none; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 14px;
            transition: transform .2s; z-index: 20; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1 id="pageTitle">اختيار الفيديوهات</h1>
            <p id="pageSub">شوف كل فيديو واضغط موافق أو مو موافق</p>
        </header>
        <div id="voterBar" class="voter" style="display:none">
            <span>رأيك ينحفظ باسم <b id="voterName"></b></span>
            <button class="link-btn" id="changeName" type="button">تغيير الاسم</button>
        </div>
        <div id="list"><div class="state">جاري التحميل...</div></div>
    </div>

    <div class="overlay" id="nameOverlay">
        <form class="dialog" id="nameForm">
            <h2>اكتب اسمك</h2>
            <p>عشان نعرف رأي كل واحد</p>
            <input id="nameInput" type="text" maxlength="60" autocomplete="name" placeholder="الاسم" required>
            <button class="primary" type="submit">تمام</button>
        </form>
    </div>
    <div class="player" id="player" role="dialog" aria-modal="true">
        <div class="player-bar">
            <button class="player-close" id="playerClose" type="button">✕ رجوع</button>
            <b id="playerTitle"></b>
            <a class="player-open" id="playerOpen" href="#" target="_blank" rel="noopener">ما اشتغل؟ افتحه هنا</a>
        </div>
        <div class="player-wait" id="playerWait">جاري تحميل الفيديو...</div>
        <iframe id="playerFrame" title="الفيديو" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
    <script src="approve.js?v=10"></script>
</body>
</html>
